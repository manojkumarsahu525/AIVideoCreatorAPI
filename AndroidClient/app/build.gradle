plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.manoj.aivideocreator"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Enable code shrinking, obfuscation, and resource shrinking for release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    signingConfigs {
        release {
            // The properties file `keystore.properties` should not be committed. Example provided as keystore.properties.example
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Provide production API base URL via BuildConfig. Override in gradle.properties if required.
            buildConfigField "String", "API_BASE_URL", '"https://api.your-production-domain.com/"'
            buildConfigField "String", "FIREBASE_PROJECT_ID", '"your-firebase-project-id"'
        }
        debug {
            buildConfigField "String", "API_BASE_URL", '"https://10.0.2.2:5001/"'
            buildConfigField "String", "FIREBASE_PROJECT_ID", '"your-firebase-project-id"'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.9.0"

    // Compose
    implementation "androidx.compose.ui:ui:1.5.0"
    implementation "androidx.compose.material:material:1.5.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.0"
    implementation "androidx.activity:activity-compose:1.8.0"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"

    // Retrofit + Gson
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // ExoPlayer
    implementation "com.google.android.exoplayer:exoplayer:2.20.2"

    // Firebase Auth
    implementation 'com.google.firebase:firebase-auth:22.1.1'

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.7.0"
    // DataStore Preferences
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    // Encrypted storage for tokens
    implementation "androidx.security:security-crypto:1.1.0"
}
