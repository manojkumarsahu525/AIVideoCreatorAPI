name: CI/CD - .NET

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AIVideoCreatorAPI/AIVideoCreatorAPI.csproj

      - name: Build
        run: dotnet build AIVideoCreatorAPI/AIVideoCreatorAPI.csproj --configuration Release --no-restore

      - name: Run tests
        run: |
          set -e
          # Run tests if any exist. Don't fail the job if there are no tests configured.
          dotnet test --no-build --verbosity normal || echo "No tests found or some tests failed"

      - name: Publish
        run: dotnet publish AIVideoCreatorAPI/AIVideoCreatorAPI.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
